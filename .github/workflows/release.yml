name: Release APK

# Run by hand from the Actions tab. Builds a debug APK from main, tags it
# v<versionName> and publishes it as a GitHub release and an Actions artifact.
# Bump versionName and versionCode in app/build.gradle.kts before running.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if git ls-remote --exit-code --tags origin "refs/tags/v$version" > /dev/null; then
            echo "::error::v$version is already released. Bump versionName and versionCode in app/build.gradle.kts."
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: |
            21
            17

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      # Debug build: the release build type has no signing config, so its APK won't install.
      - name: Test and build APK
        run: |
          chmod +x ./gradlew
          ./gradlew check assembleDebug --parallel --build-cache
          cp app/build/outputs/apk/debug/*.apk "around-${{ steps.version.outputs.tag }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: around-${{ steps.version.outputs.tag }}
          path: around-${{ steps.version.outputs.tag }}.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" "around-$TAG.apk" --target "$GITHUB_SHA" --title "Around $TAG" --generate-notes
