# Co-authored-by: Claude Opus 5.5 <noreply@anthropic.com>
name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# A new push to a PR cancels that PR's older run, whose result no one will read. Runs on main all
# finish, so every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    # TEMPORARY (#125): times the emulator at 2, 3 and 4 cores in one run; reverted after.
    strategy:
      fail-fast: false
      matrix:
        cores: ["2", "3", "4"]

    # The emulator the team develops on, a Pixel 10a with API 37.1, so a test means the same thing
    # on CI as locally. The command-line tools have no pixel_10a profile; pixel_9 has the same
    # screen (1080x2424, 420 dpi). The Pixel 10a AVD has 4 cores, as many as the runner has; the
    # action's default is 2. Unlike the Pixel 10a AVD, the image has no Play Store: CI boots it
    # fresh every run, and the Play Store would update Google Play services mid-run, which kills
    # the app under test. Both emulator steps and the AVD cache key read these.
    env:
      AVD_API_LEVEL: "37.1"
      AVD_TARGET: google_apis_ps16k
      AVD_PROFILE: pixel_9
      AVD_CORES: ${{ matrix.cores }}

    steps:
      # The emulator needs a lot of disk: the restored AVD, its system image and Gradle's caches.
      # Azure-hosted runners have plenty (88 GB free), but on 4 Nov a run placed on an AWS-hosted
      # runner ran out of space installing the system image. Deleting preinstalled SDKs the build
      # never uses (.NET, Haskell, Swift, CodeQL) frees 14 GB in about 15 s; df prints the free
      # space before and after.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis.

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux.
      # Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: |
            21
            17

      # google-services.json is required to build the app but is gitignored (it is
      # per-project Firebase config). It is restored here from the GOOGLE_SERVICES
      # repo secret so the build can run on CI.
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo "::error::GOOGLE_SERVICES secret is not set. Add it in the repo settings (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # Without a keystore of its own, every CI run would sign debug builds with a new random one.
      # The Maps API key only accepts registered certificates, so the CI restores the team's CI
      # keystore from the DEBUG_KEYSTORE secret, whose SHA-1 is registered, and points Gradle at it
      # with DEBUG_KEYSTORE_FILE for every later step. The keystore must stay out of the repository.
      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
          # The CI keystore's SHA-1, registered on the Maps API key; see the README
          REGISTERED_SHA1: BA:28:CF:28:FF:37:5A:A9:85:5D:7A:43:84:38:26:0A:1D:14:99:4D
        run: |
          keystore="$RUNNER_TEMP/ci-debug.keystore"
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 --decode > "$keystore"
          else
            echo "::error::DEBUG_KEYSTORE secret is not set. See \"Google Maps API key\" in the README."
            exit 1
          fi
          # Any other keystore builds fine but gets an empty map, so check it here, where it's clear
          sha1=$(keytool -list -v -keystore "$keystore" -storepass android \
            -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p')
          echo "Restored debug keystore SHA-1: $sha1"
          if [ "$sha1" != "$REGISTERED_SHA1" ]; then
            echo "::error::DEBUG_KEYSTORE holds a keystore with SHA-1 $sha1, not the registered $REGISTERED_SHA1. See \"Google Maps API key\" in the README."
            exit 1
          fi
          echo "DEBUG_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      # Caching is a very useful part of a CI, as a workflow is executed in a clean environment every time,
      # this means that one would need to re-download and re-process gradle files for every run. Which is very time consuming.
      #
      # To avoid that, we cache the gradle folder to reuse it later.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # The runner's command-line tools (12.0) predate the pixel_9 profile, so avdmanager rejects it.
      # When the runner has none, android-emulator-runner installs the newer ones it bundles. That
      # behaviour is the action's own, so both emulator steps pin its exact version. The runner sets
      # ANDROID_HOME for shell steps only; writing it to GITHUB_ENV lets the system image cache read it.
      - name: Remove the runner's outdated Android command-line tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      # Cache the Emulator, if the cache does not hit, create the emulator
      - name: AVD cache
        uses: actions/cache/restore@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.AVD_API_LEVEL }}-${{ env.AVD_TARGET }}-${{ env.AVD_PROFILE }}-${{ env.AVD_CORES }}cores

      # The AVD cache holds the AVD and its snapshot, not the system image it boots, which lives in the
      # SDK. Without this cache, both emulator steps download the image again (about a minute); with
      # it, their sdkmanager finds the image installed and skips it.
      - name: System image cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-${{ env.AVD_API_LEVEL }}/${{ env.AVD_TARGET }}/x86_64
          key: system-image-${{ env.AVD_API_LEVEL }}-${{ env.AVD_TARGET }}-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Check formatting
      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      # This step runs gradle commands to build the application
      - name: Assemble
        # Only the steps that build the app (Assemble, Run tests, Run instrumented tests) get the
        # Maps API key, which app/build.gradle.kts writes into the manifest; the other steps, like
        # npm installs, never see it.
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assembleDebug --parallel --build-cache

      - name: Setup NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Started once, in the background, so it is available to both unit tests
      # (Robolectric can hit it over the network) and instrumented tests below.
      - name: Start Firebase emulators
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          firebase emulators:start --only auth,firestore,storage --project demo-project &
          npx wait-on tcp:9099 tcp:8080 tcp:9199

      # Run unit tests + lint
      - name: Run tests
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # To run the CI with debug information, add --info
          ./gradlew check --parallel --build-cache

      # Run connected (instrumented) tests on the emulator. When they fail, print the device's crash
      # log and its process deaths before the emulator shuts down: Gradle can't fetch the logcat of
      # a test whose process crashed, so this is the only trace of why. The log is cleared first, so
      # it only holds this run, not the snapshot's boot.
      - name: Run instrumented tests
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew connectedCheck --parallel --build-cache || { adb logcat -d -b crash; adb logcat -d -b system | grep -E 'has died|Killing|lmkd|ANR in'; exit 1; }

      # When the instrumented tests fail, show what the Maps SDK saw. Google rejects a build whose key
      # or signing certificate isn't registered, and the map then never moves: the device log names
      # the certificate Google got, and apksigner shows the one the CI signed with.
      - name: Show Maps signing details
        if: failure()
        run: |
          echo "Debug APK signed with:"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-1' || true
          echo "Maps authorization errors in the device logs:"
          logs=app/build/outputs/androidTest-results/connected/debug/*/logcat-*.txt
          if grep -qh "Authorization failure" $logs 2>/dev/null; then
            grep -h -A6 "Authorization failure" $logs | head -40
          else
            echo "none"
          fi

      # Each instrumented test's duration and device log, kept after the emulator is gone: to find
      # the slow tests, and to debug a failure without rerunning it.
      - name: Upload instrumented test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results-${{ matrix.cores }}cores
          path: app/build/outputs/androidTest-results/connected/
          retention-days: 7

      # This step generates the coverage report which will be uploaded to sonar
      - name: Generate Coverage Report
        run: |
          ./gradlew jacocoTestReport

      # Upload the various reports to sonar
      - name: Upload report to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache
