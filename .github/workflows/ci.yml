# Co-authored-by: Claude Fable 5.1 <noreply@anthropic.com>
name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# A new push to a PR cancels that PR's older run, whose result no one will read. Runs on main all
# finish, so every merge keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The jobs run in parallel, each on its own runner, so a run takes as long as its slowest job
# rather than the sum of its parts: `checks` formats, lints and unit-tests; each `instrumented`
# job boots an emulator and runs one shard of the instrumented tests; `report` waits for them all,
# merges their coverage and uploads it to SonarCloud. Every job starts from the same
# .github/actions/setup-build.
jobs:
  checks:
    name: Format, lint and unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          google-services: ${{ secrets.GOOGLE_SERVICES }}
          debug-keystore: ${{ secrets.DEBUG_KEYSTORE }}

      # Formatting, then unit tests and lint. Only the steps that build the app get the Maps API
      # key, which app/build.gradle.kts writes into the manifest; the other steps never see it.
      - name: KTFmt Check, unit tests and lint
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # To run the CI with debug information, add --info
          ./gradlew ktfmtCheck check --parallel --build-cache

      # What the report job reads from here: the unit tests' coverage and results, and the lint
      # report. The artifact's root is app/build, the paths' common ancestor.
      - name: Upload unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-results
          path: |
            app/build/outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.xml
          retention-days: 1

  instrumented:
    name: Instrumented tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest

    # One job per shard. AndroidJUnitRunner gives each test to one shard by a hash of its name, so
    # the shards take about the same time; the test runner reads how many there are from the
    # matrix, so adding a shard here is the only change.
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    # The emulator the team develops on, a Pixel 10a with API 37.1, so a test means the same thing
    # on CI as locally. The command-line tools have no pixel_10a profile; pixel_9 has the same
    # screen (1080x2424, 420 dpi). The Pixel 10a AVD has 4 cores, as many as the runner has; the
    # action's default is 2. Unlike the Pixel 10a AVD, the image has no Play Store: CI boots it
    # fresh every run, and the Play Store would update Google Play services mid-run, which kills
    # the app under test. Both emulator steps and the AVD cache key read these.
    env:
      AVD_API_LEVEL: "37.1"
      AVD_TARGET: google_apis_ps16k
      AVD_PROFILE: pixel_9
      AVD_CORES: "4"

    steps:
      # The emulator needs a lot of disk: the restored AVD, its system image and Gradle's caches.
      # Azure-hosted runners have plenty (88 GB free), but on 4 Nov a run placed on an AWS-hosted
      # runner ran out of space installing the system image. Deleting preinstalled SDKs the build
      # never uses (.NET, Haskell, Swift, CodeQL) frees 14 GB in about 15 s; df prints the free
      # space before and after.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL"
          df -h /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux.
      # Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          google-services: ${{ secrets.GOOGLE_SERVICES }}
          debug-keystore: ${{ secrets.DEBUG_KEYSTORE }}

      - name: Setup NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Firebase CLI
        id: firebase-cli
        run: |
          npm install -g firebase-tools
          echo "version=$(firebase --version)" >> "$GITHUB_OUTPUT"

      # The CLI downloads the emulator jars it needs on first use, so they are cached per CLI
      # version; a new CLI version downloads its own once.
      - name: Firebase emulators cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ steps.firebase-cli.outputs.version }}

      # Started in the background this early, so they boot while the caches below are restored
      # and the app is assembled; the instrumented tests wait for them before they start.
      - name: Start Firebase emulators
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          firebase emulators:start --only auth,firestore,storage --project demo-project > firebase-emulators.log 2>&1 &

      # The runner's command-line tools (12.0) predate the pixel_9 profile, so avdmanager rejects it.
      # When the runner has none, android-emulator-runner installs the newer ones it bundles. That
      # behaviour is the action's own, so both emulator steps pin its exact version. The runner sets
      # ANDROID_HOME for shell steps only; writing it to GITHUB_ENV lets the system image cache read it.
      - name: Remove the runner's outdated Android command-line tools
        run: |
          rm -rf "$ANDROID_HOME/cmdline-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      # Cache the Emulator, if the cache does not hit, create the emulator
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.AVD_API_LEVEL }}-${{ env.AVD_TARGET }}-${{ env.AVD_PROFILE }}-${{ env.AVD_CORES }}cores

      # The AVD cache holds the AVD and its snapshot, not the system image it boots, which lives in the
      # SDK. Without this cache, both emulator steps download the image again (about a minute); with
      # it, their sdkmanager finds the image installed and skips it.
      - name: System image cache
        uses: actions/cache@v6
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-${{ env.AVD_API_LEVEL }}/${{ env.AVD_TARGET }}/x86_64
          key: system-image-${{ env.AVD_API_LEVEL }}-${{ env.AVD_TARGET }}-x86_64

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      # Builds the app before the emulator boots, so a build error fails here, on its own.
      - name: Assemble
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assembleDebug --parallel --build-cache

      - name: Wait for the Firebase emulators
        run: npx wait-on -t 120000 tcp:9099 tcp:8080 tcp:9199 || { cat firebase-emulators.log; exit 1; }

      # Run this shard of the connected (instrumented) tests on the emulator. When they fail, print
      # the device's crash log and its process deaths before the emulator shuts down: Gradle can't
      # fetch the logcat of a test whose process crashed, so this is the only trace of why. The log
      # is cleared first, so it only holds this run, not the snapshot's boot. The action runs the
      # script one line at a time, so the Gradle command stays on one line.
      - name: Run instrumented tests
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          SHARD_ARGS: -Pandroid.testInstrumentationRunnerArguments.numShards=${{ strategy.job-total }} -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shard }}
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ env.AVD_API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          profile: ${{ env.AVD_PROFILE }}
          cores: ${{ env.AVD_CORES }}
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew connectedCheck --parallel --build-cache $SHARD_ARGS || { adb logcat -d -b crash; adb logcat -d -b system | grep -E 'has died|Killing|lmkd|ANR in'; exit 1; }

      # When the instrumented tests fail, show what the Maps SDK saw. Google rejects a build whose key
      # or signing certificate isn't registered, and the map then never moves: the device log names
      # the certificate Google got, and apksigner shows the one the CI signed with.
      - name: Show Maps signing details
        if: failure()
        run: |
          echo "Debug APK signed with:"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-1' || true
          echo "Maps authorization errors in the device logs:"
          logs=app/build/outputs/androidTest-results/connected/debug/*/logcat-*.txt
          if grep -qh "Authorization failure" $logs 2>/dev/null; then
            grep -h -A6 "Authorization failure" $logs | head -40
          else
            echo "none"
          fi

      # Each instrumented test's duration and device log, kept after the emulator is gone: to find
      # the slow tests, and to debug a failure without rerunning it.
      - name: Upload instrumented test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-results-${{ matrix.shard }}
          path: app/build/outputs/androidTest-results/connected/
          retention-days: 7

      # This shard's coverage, for the report job to merge with the other shards' and the unit tests'
      - name: Upload instrumented test coverage
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-coverage-${{ matrix.shard }}
          path: app/build/outputs/code_coverage/debugAndroidTest/connected/
          retention-days: 1

  report:
    name: Coverage and SonarCloud
    needs: [checks, instrumented]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis.

      - name: Set up the build
        uses: ./.github/actions/setup-build
        with:
          google-services: ${{ secrets.GOOGLE_SERVICES }}
          debug-keystore: ${{ secrets.DEBUG_KEYSTORE }}

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Back where the checks job's Gradle wrote them, where Sonar and jacocoTestReport look
      - name: Download unit test results
        uses: actions/download-artifact@v7
        with:
          name: unit-test-results
          path: app/build/

      # One directory per shard under the directory the connected tests write to; jacocoTestReport
      # looks for coverage.ec files anywhere below it
      - name: Download instrumented test coverage
        uses: actions/download-artifact@v7
        with:
          pattern: instrumented-coverage-*
          path: app/build/outputs/code_coverage/debugAndroidTest/connected/

      # jacocoTestReport compiles the app's classes and reports on the coverage data it finds; Sonar
      # reads the test classes too, so they are compiled as well. One Gradle call for both.
      - name: Generate Coverage Report and upload it to SonarCloud
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./gradlew compileDebugUnitTestKotlin compileDebugAndroidTestKotlin jacocoTestReport sonar \
            --parallel --build-cache
