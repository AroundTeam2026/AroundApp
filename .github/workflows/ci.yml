# Co-authored-by: Claude Opus 5.5 <noreply@anthropic.com>
name: CI - Test Runner

# Run the workflow when commits are pushed on main or when a PR is modified

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
      - reopened

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of Sonar analysis.

      # Kernel-based Virtual Machine (KVM) is an open source virtualization technology built into Linux.
      # Enabling it allows the Android emulator to run faster.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "temurin"
          java-version: |
            21
            17

      # google-services.json is required to build the app but is gitignored (it is
      # per-project Firebase config). It is restored here from the GOOGLE_SERVICES
      # repo secret so the build can run on CI.
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES }}
        run: |
          if [ -n "$GOOGLE_SERVICES" ]; then
            echo "$GOOGLE_SERVICES" | base64 --decode > ./app/google-services.json
          else
            echo "::error::GOOGLE_SERVICES secret is not set. Add it in the repo settings (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      # Without a keystore of its own, every CI run would sign debug builds with a new random one.
      # The Maps API key only accepts registered certificates, so the CI restores the team's CI
      # keystore from the DEBUG_KEYSTORE secret, whose SHA-1 is registered, and points Gradle at it
      # with DEBUG_KEYSTORE_FILE for every later step. The keystore must stay out of the repository.
      - name: Decode debug keystore
        env:
          DEBUG_KEYSTORE: ${{ secrets.DEBUG_KEYSTORE }}
          # The CI keystore's SHA-1, registered on the Maps API key; see the README
          REGISTERED_SHA1: BA:28:CF:28:FF:37:5A:A9:85:5D:7A:43:84:38:26:0A:1D:14:99:4D
        run: |
          keystore="$RUNNER_TEMP/ci-debug.keystore"
          if [ -n "$DEBUG_KEYSTORE" ]; then
            echo "$DEBUG_KEYSTORE" | base64 --decode > "$keystore"
          else
            echo "::error::DEBUG_KEYSTORE secret is not set. See \"Google Maps API key\" in the README."
            exit 1
          fi
          # Any other keystore builds fine but gets an empty map, so check it here, where it's clear
          sha1=$(keytool -list -v -keystore "$keystore" -storepass android \
            -alias androiddebugkey | sed -n 's/^[[:space:]]*SHA1: //p')
          echo "Restored debug keystore SHA-1: $sha1"
          if [ "$sha1" != "$REGISTERED_SHA1" ]; then
            echo "::error::DEBUG_KEYSTORE holds a keystore with SHA-1 $sha1, not the registered $REGISTERED_SHA1. See \"Google Maps API key\" in the README."
            exit 1
          fi
          echo "DEBUG_KEYSTORE_FILE=$keystore" >> "$GITHUB_ENV"

      # Caching is a very useful part of a CI, as a workflow is executed in a clean environment every time,
      # this means that one would need to re-download and re-process gradle files for every run. Which is very time consuming.
      #
      # To avoid that, we cache the gradle folder to reuse it later.
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Cache SonarQube packages
        uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Cache the Emulator, if the cache does not hit, create the emulator
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Grant execute permission for gradlew
        run: |
          chmod +x ./gradlew

      # Check formatting
      - name: KTFmt Check
        run: |
          ./gradlew ktfmtCheck

      # This step runs gradle commands to build the application
      - name: Assemble
        # Only the steps that build the app (Assemble, Run tests, Run instrumented tests) get the
        # Maps API key, which app/build.gradle.kts writes into the manifest; the other steps, like
        # npm installs, never see it.
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # To run the CI with debug information, add --info
          ./gradlew assembleDebug --parallel --build-cache

      - name: Setup NodeJS
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Started once, in the background, so it is available to both unit tests
      # (Robolectric can hit it over the network) and instrumented tests below.
      - name: Start Firebase emulators
        run: |
          export JAVA_HOME="$JAVA_HOME_21_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          firebase emulators:start --only auth,firestore --project demo-project &
          npx wait-on tcp:9099 tcp:8080

      # Run unit tests + lint
      - name: Run tests
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          # To run the CI with debug information, add --info
          ./gradlew check --parallel --build-cache

      # Run connected (instrumented) tests on the emulator
      - name: Run instrumented tests
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedCheck --parallel --build-cache

      # When the instrumented tests fail, show what the Maps SDK saw. Google rejects a build whose key
      # or signing certificate isn't registered, and the map then never moves: the device log names
      # the certificate Google got, and apksigner shows the one the CI signed with.
      - name: Show Maps signing details
        if: failure()
        run: |
          echo "Debug APK signed with:"
          "$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk | grep -i 'SHA-1' || true
          echo "Maps authorization errors in the device logs:"
          logs=app/build/outputs/androidTest-results/connected/debug/*/logcat-*.txt
          if grep -qh "Authorization failure" $logs 2>/dev/null; then
            grep -h -A6 "Authorization failure" $logs | head -40
          else
            echo "none"
          fi

      # This step generates the coverage report which will be uploaded to sonar
      - name: Generate Coverage Report
        run: |
          ./gradlew jacocoTestReport

      # Upload the various reports to sonar
      - name: Upload report to SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --parallel --build-cache
